apiVersion: apps/v1
kind: Deployment

metadata:
  name: python-devops-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: python-devops-app

  strategy:
    type: RollingUpdate

  template:

    metadata:
      labels:
        app: python-devops-app

    spec:

      containers:
      - name: python-devops-app

        image: kjrashmi20/python-devops-app:v1

        ports:
        - containerPort: 5000

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"

          limits:
            memory: "256Mi"
            cpu: "200m"

        readinessProbe:
          httpGet:
            path: /
            port: 5000

          initialDelaySeconds: 5
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /
            port: 5000

          initialDelaySeconds: 15
          periodSeconds: 20
